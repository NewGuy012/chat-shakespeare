[project]
name = "chat-shakespeare"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "accelerate>=1.16.0",
    "datasets>=5.2.0",
    "huggingface-hub>=2.5.0",
    "marimo>=0.26.0",
    "safetensors>=0.8.0",
    "tiktoken>=0.14.0",
    "torch>=2.15.0",
]
[tool.marimo.runtime]
pythonpath = ["src"]

[tool.ruff.lint.per-file-ignores]
# Marimo cells use trailing bare expressions for display and trailing `return` to suppress output.
"main.py" = ["B018", "PLR1711"]

[dependency-groups]
dev = [
    "ruff>=0.17.6",
    "ty>=0.0.112",
]
